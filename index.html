    <script>
        // ----------------- STATE MANAGEMENT -----------------
        window.currentUserRole = null;
        window.state = {
            selectedClass: 'ป.6',
            selectedCourseId: 'c1',
            activeTab: 'settings',
            academicYear: '2569',
            teacherName: 'นายสมชาย รักเรียน',
            headName: 'นางสาวเรียนดี มีวิชา',
            directorName: 'นายอำนวย บริหารเก่ง',
            logoUrl: 'IMG_4847.jpeg',



                        courses: {
                'ป.1': [], 'ป.2': [], 'ป.3': [], 'ป.4': [], 'ป.5': [],
                'ป.6': [
                    { id: 'c1', code: 'ค16101', name: 'คณิตศาสตร์พื้นฐาน', credit: '2.0', midCollect: 35, midExam: 15, finalCollect: 35, finalExam: 15, indicators: ['ค 1.1 ป.6/1 เข้าใจและประยุกต์ใช้อัตราส่วน'] }
                ]
            },





            
            
            students: {
                'ป.1': [{ id: '1101', no: 1, name: 'ด.ช. ทดสอบ ป.1', statusR: false }],
                'ป.2': [], 'ป.3': [], 'ป.4': [], 'ป.5': [],
                'ป.6': [
                    { id: '1001', no: 1, name: 'ด.ช. กตัญญู รู้คุณ', statusR: false },
                    { id: '1002', no: 2, name: 'ด.ญ. ขวัญใจ ใฝ่ดี', statusR: false },
                    { id: '1003', no: 3, name: 'ด.ช. คมสัน มั่นคง', statusR: false },
                    { id: '1004', no: 4, name: 'ด.ญ. งามตา น่ารัก', statusR: false },
                    { id: '1005', no: 5, name: 'ด.ช. จอมซน คนเก่ง', statusR: false }
                ]
            },
            
            attendance: {},
            scores: {},
            evaluations: {},
            extraActivities: [
                { id: 'act_1', name: 'ลูกเสือ-ยุวกาชาด' },
                { id: 'act_2', name: 'ชุมนุม' }
            ],
            extraScores: {}
        };


        // ... โค้ดเดิมของ window.state ...

        // --- จุดที่ 1: ตั้งค่า URL และฟังก์ชันดึงข้อมูล ---
        // นำ URL ที่ได้จากข้อ 9 มาวางแทนที่ข้อความด้านล่างนี้
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWTsgTJHUz78lQtMJVP88PW25epcvI8arIj_YGlcJJO7CGhQpKeFTXkxSRkvjrX2oW/exec'; 
        
        async function loadDataFromCloud() {
            try {
                // แสดงข้อความกำลังโหลดที่หน้า Login
                const errBox = document.getElementById('loginError');
                errBox.innerText = 'กำลังโหลดข้อมูลล่าสุดจากฐานข้อมูล...';
                errBox.classList.remove('hidden');
                errBox.classList.replace('bg-red-100', 'bg-blue-100');
                errBox.classList.replace('text-red-600', 'text-blue-600');
                
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if(Object.keys(data).length > 0) {
                    window.state = data; // เอาข้อมูลจาก Sheets มาทับค่าเริ่มต้น
                }
                
                errBox.classList.add('hidden'); // ซ่อนข้อความเมื่อโหลดเสร็จ
                errBox.classList.replace('bg-blue-100', 'bg-red-100');
                errBox.classList.replace('text-blue-600', 'text-red-600');
            } catch(e) {
                console.error('Error loading data:', e);
            }
        }

        // สั่งให้โหลดข้อมูลทันทีที่เปิดหน้าเว็บ
        window.onload = loadDataFromCloud;
        // ------------------------------------------------

      

        // --- จุดที่ 2: ฟังก์ชันสำหรับเซฟข้อมูล ---
        let saveTimeout = null;
        function saveDataToCloud() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // เพิ่มบรรทัดนี้เพื่อป้องกันการบล็อกข้ามโดเมนบน GitHub
                    body: JSON.stringify(window.state)
                }).catch(e => console.error('Error saving data:', e));
            }, 1500); 
        }
        // ------------------------------------------------



        // ----------------- CALENDAR LOGIC (1 YEAR) -----------------
        const thaiMonthsFull = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const daysShort = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        const daysFull = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const holidaysMap = {
            '01-01': 'วันขึ้นปีใหม่', '02-26': 'วันมาฆบูชา', '04-06': 'วันจักรี', '04-13': 'วันสงกรานต์', '04-14': 'วันสงกรานต์', '04-15': 'วันสงกรานต์',
            '05-01': 'วันแรงงานแห่งชาติ', '05-04': 'วันฉัตรมงคล', '05-22': 'วันวิสาขบูชา', '06-03': 'วันเฉลิมฯ พระราชินี', '07-20': 'วันอาสาฬหบูชา', '07-21': 'วันเข้าพรรษา',
            '07-28': 'วันเฉลิมฯ ร.10', '08-12': 'วันแม่แห่งชาติ', '10-13': 'วันนวมินทรมหาราช', '10-23': 'วันปิยมหาราช', '12-05': 'วันพ่อแห่งชาติ', '12-10': 'วันรัฐธรรมนูญ', '12-31': 'วันสิ้นปี'
        };

        const yearDates = [];
        const monthGroups = [];
        let currMonth = -1;
        
        const startDate = new Date(2026, 0, 1);
        const endDate = new Date(2026, 11, 31);
        
        while (startDate <= endDate) {
            const m = startDate.getMonth();
            const d = startDate.getDate();
            const mStr = String(m + 1).padStart(2, '0');
            const dStr = String(d).padStart(2, '0');
            const id = `2026-${mStr}-${dStr}`;
            
            const isWeekend = (startDate.getDay() === 0 || startDate.getDay() === 6);
            const holidayName = holidaysMap[`${mStr}-${dStr}`];
            
            const nextDay = new Date(startDate); nextDay.setDate(nextDay.getDate() + 1);
            const isEndOfMonth = nextDay.getMonth() !== m;

            yearDates.push({
                id: id, date: d, dayName: daysShort[startDate.getDay()], dayNameFull: daysFull[startDate.getDay()], monthIdx: m,
                isWeekend: isWeekend, isHoliday: !!holidayName, holidayName: holidayName || '', isEndOfMonth: isEndOfMonth
            });

            if (m !== currMonth) { monthGroups.push({ idx: m, name: thaiMonthsFull[m], count: 1 }); currMonth = m; } 
            else { monthGroups[monthGroups.length - 1].count++; }
            
            startDate.setDate(startDate.getDate() + 1);
        }

        // ----------------- CORE FUNCTIONS -----------------
        const getStudents = () => (window.state.students[window.state.selectedClass] || []).sort((a,b)=>a.no-b.no);
        
        
        const getCoursesForClass = () => window.state.courses[window.state.selectedClass] || [];
const getCourse = () => getCoursesForClass().find(c => c.id === window.state.selectedCourseId) || getCoursesForClass()[0] || { id: '', code: '', name: '', credit: '', midCollect: '', midExam: '', finalCollect: '', finalExam: '', indicators: [] };



        
        
        function calcAtt(studentId) {
            const atts = (window.state.attendance[window.state.selectedCourseId] || {})[studentId] || {};
            let present = 0, total = 0;
            yearDates.forEach(d => {
                const def = (d.isWeekend || d.isHoliday) ? 'หยุด' : 'มา';
                const st = atts[d.id] || def;
                if (st !== 'หยุด' && st !== '') { 
                    total++; 
                    if (st === 'มา' || st === 'ลาป่วย' || st === 'ลากิจ') present++; 
                }
            });
            return { p: present, t: total, pct: total === 0 ? 100 : Math.round((present/total)*100) };
        }

        function getGradeStr(score, attPct, isR) {
            if (isR) return { g: 'ร', c: 'text-orange-500' };
            if (attPct < 80) return { g: 'มส', c: 'text-red-600' };
            const s = Math.round(score);
            if (s>=80) return {g:'4',c:'text-green-600'}; if (s>=75) return {g:'3.5',c:'text-green-500'};
            if (s>=70) return {g:'3',c:'text-blue-600'}; if (s>=65) return {g:'2.5',c:'text-blue-500'};
            if (s>=60) return {g:'2',c:'text-yellow-600'}; if (s>=55) return {g:'1.5',c:'text-yellow-500'};
            if (s>=50) return {g:'1',c:'text-orange-500'}; return {g:'0',c:'text-red-500'};
        }

        // ----------------- RENDERING SYSTEM -----------------
        function renderApp() {


        // ----------------- RENDERING SYSTEM -----------------
       
            // --- จุดที่ 3: สั่งให้เซฟข้อมูลลงเน็ตทุกครั้งที่หน้าจอเปลี่ยน ---
            saveDataToCloud();
            document.getElementById('userRoleDisplay').innerHTML = window.currentUserRole === 'admin' ? '<i class="fa-solid fa-shield-halved"></i> ผู้ดูแลระบบ (Admin)' : '<i class="fa-solid fa-user-tie"></i> ครูผู้สอน (Teacher)';
            document.getElementById('classSelector').value = window.state.selectedClass;

            const cSel = document.getElementById('courseSelector');
            const currentCourses = window.state.courses[window.state.selectedClass] || [];
            cSel.innerHTML = currentCourses.map(c => `<option value="${c.id}" ${c.id===window.state.selectedCourseId?'selected':''}>${c.code} ${c.name}</option>`).join('');
            if(currentCourses.length === 0) cSel.innerHTML = '<option value="">ไม่มีรายวิชา</option>';





            
            let tabsDef = [
                { id: 'settings', label: 'จัดการรายวิชา', icon: 'fa-gear' },
                { id: 'attendance', label: 'เช็คเวลาเรียน', icon: 'fa-calendar-check' },
                { id: 'grading', label: 'คะแนนและเกรด', icon: 'fa-calculator' },
                { id: 'evaluations', label: 'คุณลักษณะฯ', icon: 'fa-award' },
                { id: 'activities', label: 'กิจกรรมพัฒนาผู้เรียน', icon: 'fa-campground' },
                { id: 'print', label: 'พิมพ์รายงาน (SAR)', icon: 'fa-print' }
            ];
            if (window.currentUserRole === 'admin') tabsDef.push({ id: 'promotion', label: 'เลื่อนชั้น (Admin)', icon: 'fa-angles-up' });
            
            document.getElementById('tabsContainer').innerHTML = tabsDef.map(t => `
                <button onclick="window.setTab('${t.id}')" class="flex items-center space-x-1 sm:space-x-2 px-3 sm:px-5 py-2 sm:py-3 text-xs sm:text-sm font-medium transition-colors border-b-2 ${window.state.activeTab === t.id ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50'} whitespace-nowrap">
                    <i class="fa-solid ${t.icon}"></i> <span>${t.label}</span>
                </button>
            `).join('');

            const container = document.getElementById('contentArea');
            if(window.state.activeTab === 'settings') container.innerHTML = htmlSettings();
            else if(window.state.activeTab === 'attendance') container.innerHTML = htmlAttendance();
            else if(window.state.activeTab === 'grading') container.innerHTML = htmlGrading();
            else if(window.state.activeTab === 'evaluations') container.innerHTML = htmlEvaluations();
            else if(window.state.activeTab === 'activities') container.innerHTML = htmlActivities();
            else if(window.state.activeTab === 'print') container.innerHTML = htmlPrintSummary();
            else if(window.state.activeTab === 'promotion') container.innerHTML = htmlPromotion();
        }

        // ----------------- HTML TEMPLATES -----------------
        function htmlSettings() {

        // ----------------- EVENT HANDLERS -----------------
        window.handleLogin = function() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === 'admin123') window.currentUserRole = 'admin';
            else if(u === 'teacher' && p === 'teacher123') window.currentUserRole = 'teacher';
            else { document.getElementById('loginError').innerText = 'ข้อมูลไม่ถูกต้อง'; document.getElementById('loginError').classList.remove('hidden'); return; }
            
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appWrapper').classList.remove('hidden');
            document.getElementById('appWrapper').classList.add('flex');
            window.state.activeTab = 'settings'; 
            renderApp();
        };

        window.handleLogout = function() {
            window.currentUserRole = null;
            document.getElementById('appWrapper').classList.add('hidden');
            document.getElementById('appWrapper').classList.remove('flex');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').classList.add('hidden');
        };

        window.setTab = function(t) { window.state.activeTab = t; renderApp(); };




                window.changeClass = function() { 
            window.state.selectedClass = document.getElementById('classSelector').value; 
            const classCourses = getCoursesForClass();
            window.state.selectedCourseId = classCourses.length > 0 ? classCourses[0].id : '';
            renderApp(); 
        };
        window.changeCourse = function() { window.state.selectedCourseId = document.getElementById('courseSelector').value; renderApp(); };
        
        window.saveCourseCfg = function() {
            const c = getCourse(); if (!c.id) return;
            c.code = document.getElementById('cfg_code').value;
            c.name = document.getElementById('cfg_name').value;
            c.credit = document.getElementById('cfg_credit').value;
            c.midCollect = Number(document.getElementById('cfg_mc').value)||0;
            c.midExam = Number(document.getElementById('cfg_me').value)||0;
            c.finalCollect = Number(document.getElementById('cfg_fc').value)||0;
            c.finalExam = Number(document.getElementById('cfg_fe').value)||0;
            renderApp();
        };

        window.addIndicator = function() {
            const c = getCourse(); if (!c.id) return;
            const v = document.getElementById('new_ind').value.trim();
            if(v) { c.indicators = c.indicators || []; c.indicators.push(v); renderApp(); }
        };
        window.delIndicator = function(idx) { getCourse().indicators.splice(idx, 1); renderApp(); };

        window.addCourse = function() {
            const id = 'c' + Date.now();
            if(!window.state.courses[window.state.selectedClass]) window.state.courses[window.state.selectedClass] = [];
            window.state.courses[window.state.selectedClass].push({ id: id, code: 'NEW', name: 'รายวิชาใหม่', credit: '1.0', midCollect: 35, midExam: 15, finalCollect: 35, finalExam: 15, indicators: [] });
            window.state.selectedCourseId = id; renderApp();
        };
        
        window.delCourse = function(id) {
            window.state.courses[window.state.selectedClass] = window.state.courses[window.state.selectedClass].filter(c => c.id !== id);
            const remaining = window.state.courses[window.state.selectedClass];
            window.state.selectedCourseId = remaining.length > 0 ? remaining[0].id : ''; 
            renderApp();
        };




        

        


        window.addStudent = function() {
            const no = document.getElementById('new_s_no').value; const name = document.getElementById('new_s_name').value;
            if(no && name) { window.state.students[window.state.selectedClass].push({ id: 's'+Date.now(), no: Number(no), name: name, statusR: false }); renderApp(); }
        };
        window.delStudent = function(id) {
            window.state.students[window.state.selectedClass] = window.state.students[window.state.selectedClass].filter(s => s.id !== id); renderApp();
        };

        window.handleScore = function(sid, field, val) {
            if(!window.state.scores[window.state.selectedCourseId]) window.state.scores[window.state.selectedCourseId] = {};
            if(!window.state.scores[window.state.selectedCourseId][sid]) window.state.scores[window.state.selectedCourseId][sid] = {};
            window.state.scores[window.state.selectedCourseId][sid][field] = (field.startsWith('ind_')) ? val : (Number(val)||0);
            renderApp();
        };
        window.toggleR = function(sid) {
            const s = window.state.students[window.state.selectedClass].find(x => x.id === sid);
            if(s) { s.statusR = !s.statusR; renderApp(); }
        };
        window.handleAtt = function(sid, dateId, val) {
            if(!window.state.attendance[window.state.selectedCourseId]) window.state.attendance[window.state.selectedCourseId] = {};
            if(!window.state.attendance[window.state.selectedCourseId][sid]) window.state.attendance[window.state.selectedCourseId][sid] = {};
            window.state.attendance[window.state.selectedCourseId][sid][dateId] = val;
            renderApp();
        };
        window.handleEval = function(sid, field, val) {
            if(!window.state.evaluations[sid]) window.state.evaluations[sid] = {};
            window.state.evaluations[sid][field] = Number(val);
            renderApp();
        };
        
        window.handleExtraScore = function(sid, actId, val) {
            if(!window.state.extraScores) window.state.extraScores = {};
            if(!window.state.extraScores[sid]) window.state.extraScores[sid] = {};
            window.state.extraScores[sid][actId] = val;
            renderApp();
        };

        window.addExtraAct = function() {
            const name = document.getElementById('new_act_name').value.trim();
            if(name) {
                window.state.extraActivities = window.state.extraActivities || [];
                window.state.extraActivities.push({ id: 'act_' + Date.now(), name: name });
                renderApp();
            }
        };

        window.delExtraAct = function(id) {
            window.state.extraActivities = window.state.extraActivities.filter(a => a.id !== id);
            renderApp();
        };

        window.savePrintConfig = function(key, val) { window.state[key] = val; renderApp(); };
        window.changeLogo = function() {
            const url = prompt('ระบุ URL ของโลโก้โรงเรียน (เช่น https://...):', window.state.logoUrl);
            if(url) { window.state.logoUrl = url; document.getElementById('headerLogo').src = url; renderApp(); }
        };

        window.promoteStudents = function() {
            const confirmText = prompt("พิมพ์คำว่า 'CONFIRM' เพื่อยืนยันการเลื่อนชั้นและล้างข้อมูลทั้งหมด");
            if (confirmText === 'CONFIRM') {
                window.state.students['ป.6'] = window.state.students['ป.5'];
                window.state.students['ป.5'] = window.state.students['ป.4'];
                window.state.students['ป.4'] = window.state.students['ป.3'];
                window.state.students['ป.3'] = window.state.students['ป.2'];
                window.state.students['ป.2'] = window.state.students['ป.1'];
                window.state.students['ป.1'] = [];
                window.state.scores = {};
                window.state.attendance = {};
                window.state.evaluations = {};
                window.state.extraScores = {};
                window.state.academicYear = (Number(window.state.academicYear) + 1).toString();
                alert('เลื่อนชั้นเรียนและรีเซ็ตข้อมูลสำเร็จ! เข้าสู่ปีการศึกษา ' + window.state.academicYear);
                renderApp();
            } else {
                alert('ยกเลิกการเลื่อนชั้น (พิมพ์ไม่ถูกต้อง)');
            }
        };
    </script>
</body>
</html>
