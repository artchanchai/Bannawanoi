    <script>
        // ----------------- STATE MANAGEMENT -----------------
        window.currentUserRole = null;
        window.state = {
            selectedClass: 'ป.6',
            selectedCourseId: 'c1',
            activeTab: 'settings',
            academicYear: '2569',
            teacherName: 'นายสมชาย รักเรียน',
            headName: 'นางสาวเรียนดี มีวิชา',
            directorName: 'นายอำนวย บริหารเก่ง',
            logoUrl: 'IMG_4847.jpeg',



                        courses: {
                'ป.1': [], 'ป.2': [], 'ป.3': [], 'ป.4': [], 'ป.5': [],
                'ป.6': [
                    { id: 'c1', code: 'ค16101', name: 'คณิตศาสตร์พื้นฐาน', credit: '2.0', midCollect: 35, midExam: 15, finalCollect: 35, finalExam: 15, indicators: ['ค 1.1 ป.6/1 เข้าใจและประยุกต์ใช้อัตราส่วน'] }
                ]
            },





            
            
            students: {
                'ป.1': [{ id: '1101', no: 1, name: 'ด.ช. ทดสอบ ป.1', statusR: false }],
                'ป.2': [], 'ป.3': [], 'ป.4': [], 'ป.5': [],
                'ป.6': [
                    { id: '1001', no: 1, name: 'ด.ช. กตัญญู รู้คุณ', statusR: false },
                    { id: '1002', no: 2, name: 'ด.ญ. ขวัญใจ ใฝ่ดี', statusR: false },
                    { id: '1003', no: 3, name: 'ด.ช. คมสัน มั่นคง', statusR: false },
                    { id: '1004', no: 4, name: 'ด.ญ. งามตา น่ารัก', statusR: false },
                    { id: '1005', no: 5, name: 'ด.ช. จอมซน คนเก่ง', statusR: false }
                ]
            },
            
            attendance: {},
            scores: {},
            evaluations: {},
            extraActivities: [
                { id: 'act_1', name: 'ลูกเสือ-ยุวกาชาด' },
                { id: 'act_2', name: 'ชุมนุม' }
            ],
            extraScores: {}
        };


        // ... โค้ดเดิมของ window.state ...

        // --- จุดที่ 1: ตั้งค่า URL และฟังก์ชันดึงข้อมูล ---
        // นำ URL ที่ได้จากข้อ 9 มาวางแทนที่ข้อความด้านล่างนี้
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWmcsqw_YAkRGSBWcz0if1dztx1yxTRiY4b7HfAGW6FoX-J-RGlkNcSc3HuHnsV2Dz/exec'; 
                async function loadDataFromCloud(targetClass = 'ป.6') {
            try {
                const errBox = document.getElementById('loginError');
                if(errBox) {
                    errBox.innerText = `กำลังโหลดข้อมูลชั้น ${targetClass}...`;
                    errBox.classList.remove('hidden');
                    errBox.classList.replace('bg-red-100', 'bg-blue-100');
                    errBox.classList.replace('text-red-600', 'text-blue-600');
                }
                
                // ส่งชื่อชั้นไปขอข้อมูลเฉพาะคอลัมน์ของชั้นนั้น
                const response = await fetch(SCRIPT_URL + '?cls=' + targetClass);
                const data = await response.json();
                
                if(Object.keys(data).length > 0) {
                    window.state = data; 
                } else {
                    // ถ้ายังไม่มีข้อมูลในชีต ให้ตั้งค่าเริ่มต้น
                    window.state.selectedClass = targetClass;
                    window.state.students = window.state.students || {};
                    window.state.students[targetClass] = window.state.students[targetClass] || [];
                    window.state.courses = window.state.courses || {};
                    window.state.courses[targetClass] = window.state.courses[targetClass] || [];
                }
                
                if(errBox) {
                    errBox.classList.add('hidden');
                    errBox.classList.replace('bg-blue-100', 'bg-red-100');
                    errBox.classList.replace('text-blue-600', 'text-red-600');
                }
                
                // เลืออกวิชาแรกของชั้นอัตโนมัติ
                const classCourses = window.state.courses[targetClass] || [];
                window.state.selectedCourseId = classCourses.length > 0 ? classCourses[0].id : '';
                
                // ถ้าระบบโหลดข้อมูลเสร็จตอนที่ล็อกอินเข้ามาแล้ว ให้แสดงผลหน้าจอ
                if (window.currentUserRole) {
                    renderApp();
                }
            } catch(e) {
                console.error('Error loading data:', e);
            }
        }

        // สั่งให้โหลดข้อมูลเริ่มต้นที่ ป.6 ทันทีที่เปิดหน้าเว็บ
        window.onload = () => loadDataFromCloud('ป.6');

        // ------------------------------------------------

      

        // --- จุดที่ 2: ฟังก์ชันสำหรับเซฟข้อมูล ---
        let saveTimeout = null;
        function saveDataToCloud() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // เพิ่มบรรทัดนี้เพื่อป้องกันการบล็อกข้ามโดเมนบน GitHub
                    body: JSON.stringify(window.state)
                }).catch(e => console.error('Error saving data:', e));
            }, 1500); 
        }
        // ------------------------------------------------



        // ----------------- CALENDAR LOGIC (1 YEAR) -----------------
        const thaiMonthsFull = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const daysShort = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        const daysFull = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const holidaysMap = {
            '01-01': 'วันขึ้นปีใหม่', '02-26': 'วันมาฆบูชา', '04-06': 'วันจักรี', '04-13': 'วันสงกรานต์', '04-14': 'วันสงกรานต์', '04-15': 'วันสงกรานต์',
            '05-01': 'วันแรงงานแห่งชาติ', '05-04': 'วันฉัตรมงคล', '05-22': 'วันวิสาขบูชา', '06-03': 'วันเฉลิมฯ พระราชินี', '07-20': 'วันอาสาฬหบูชา', '07-21': 'วันเข้าพรรษา',
            '07-28': 'วันเฉลิมฯ ร.10', '08-12': 'วันแม่แห่งชาติ', '10-13': 'วันนวมินทรมหาราช', '10-23': 'วันปิยมหาราช', '12-05': 'วันพ่อแห่งชาติ', '12-10': 'วันรัฐธรรมนูญ', '12-31': 'วันสิ้นปี'
        };

        const yearDates = [];
        const monthGroups = [];
        let currMonth = -1;
        
        const startDate = new Date(2026, 0, 1);
        const endDate = new Date(2026, 11, 31);
        
        while (startDate <= endDate) {
            const m = startDate.getMonth();
            const d = startDate.getDate();
            const mStr = String(m + 1).padStart(2, '0');
            const dStr = String(d).padStart(2, '0');
            const id = `2026-${mStr}-${dStr}`;
            
            const isWeekend = (startDate.getDay() === 0 || startDate.getDay() === 6);
            const holidayName = holidaysMap[`${mStr}-${dStr}`];
            
            const nextDay = new Date(startDate); nextDay.setDate(nextDay.getDate() + 1);
            const isEndOfMonth = nextDay.getMonth() !== m;

            yearDates.push({
                id: id, date: d, dayName: daysShort[startDate.getDay()], dayNameFull: daysFull[startDate.getDay()], monthIdx: m,
                isWeekend: isWeekend, isHoliday: !!holidayName, holidayName: holidayName || '', isEndOfMonth: isEndOfMonth
            });

            if (m !== currMonth) { monthGroups.push({ idx: m, name: thaiMonthsFull[m], count: 1 }); currMonth = m; } 
            else { monthGroups[monthGroups.length - 1].count++; }
            
            startDate.setDate(startDate.getDate() + 1);
        }

        // ----------------- CORE FUNCTIONS -----------------
        const getStudents = () => (window.state.students[window.state.selectedClass] || []).sort((a,b)=>a.no-b.no);
        
        
        const getCoursesForClass = () => window.state.courses[window.state.selectedClass] || [];
const getCourse = () => getCoursesForClass().find(c => c.id === window.state.selectedCourseId) || getCoursesForClass()[0] || { id: '', code: '', name: '', credit: '', midCollect: '', midExam: '', finalCollect: '', finalExam: '', indicators: [] };



        
        
        function calcAtt(studentId) {
            const atts = (window.state.attendance[window.state.selectedCourseId] || {})[studentId] || {};
            let present = 0, total = 0;
            yearDates.forEach(d => {
                const def = (d.isWeekend || d.isHoliday) ? 'หยุด' : 'มา';
                const st = atts[d.id] || def;
                if (st !== 'หยุด' && st !== '') { 
                    total++; 
                    if (st === 'มา' || st === 'ลาป่วย' || st === 'ลากิจ') present++; 
                }
            });
            return { p: present, t: total, pct: total === 0 ? 100 : Math.round((present/total)*100) };
        }

        function getGradeStr(score, attPct, isR) {
            if (isR) return { g: 'ร', c: 'text-orange-500' };
            if (attPct < 80) return { g: 'มส', c: 'text-red-600' };
            const s = Math.round(score);
            if (s>=80) return {g:'4',c:'text-green-600'}; if (s>=75) return {g:'3.5',c:'text-green-500'};
            if (s>=70) return {g:'3',c:'text-blue-600'}; if (s>=65) return {g:'2.5',c:'text-blue-500'};
            if (s>=60) return {g:'2',c:'text-yellow-600'}; if (s>=55) return {g:'1.5',c:'text-yellow-500'};
            if (s>=50) return {g:'1',c:'text-orange-500'}; return {g:'0',c:'text-red-500'};
        }

                window.exportToExcel = function() {
            const cls = window.state.selectedClass;
            const students = getStudents();
            
            if(students.length === 0) {
                alert("ไม่มีข้อมูลนักเรียนในชั้นนี้");
                return;
            }

            // 1. กำหนดหัวคอลัมน์ของไฟล์ Excel
            const headers = [
                "เลขที่", "ชั้น", "เลขประจำตัว", "เลข ปชช.", "ชื่อ-สกุล", 
                "หมู่เลือด", "วันเดือนปีเกิด", "อายุ", "ชื่อบิดา", "ชื่อมารดา", 
                "ชื่อผู้ปกครอง", "ความสัมพันธ์", "อาชีพ", "ที่อยู่", "เบอร์โทรศัพท์", "นักเรียนที่ใกล้เคียง"
            ];
            
            // 2. ป้องกันตัวหนังสือภาษาไทยต่างด้าวด้วย \uFEFF
            let csvContent = "\uFEFF" + headers.join(",") + "\n";
            
            // 3. ดึงข้อมูลนักเรียนแต่ละคนมาใส่แถว
            students.forEach(s => {
                const row = [
                    s.no || "", cls, s.code || "", s.nid || "", s.name || "",
                    s.bloodType || "", s.dob || "", s.age || "", s.fatherName || "", s.motherName || "",
                    s.guardianName || "", s.relation || "", s.occupation || "", s.address || "", s.phone || "", s.closeFriend || ""
                ];
                
                // ครอบข้อมูลด้วยเครื่องหมายคำพูด (") เพื่อป้องกันการตัดคำผิดพลาดหากในข้อมูลมีลูกน้ำ (,)
                const formattedRow = row.map(field => '"' + String(field).replace(/"/g, '""') + '"').join(",");
                csvContent += formattedRow + "\n";
            });
            
            // 4. สั่งสร้างไฟล์แล้วบังคับดาวน์โหลด
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `ข้อมูลนักเรียนชั้น_${cls.replace('.', '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };




        
                        window.exportAllToExcel = function() {
            if(typeof XLSX === 'undefined') { alert('กำลังเชื่อมต่อระบบสร้าง Excel โปรดรอสักครู่...'); return; }
            
            const wb = XLSX.utils.book_new();
            const cls = window.state.selectedClass;
            const students = getStudents();
            const c = getCourse();

            // แผ่นที่ 1: ข้อมูลนักเรียน
            const studentRows = [["เลขที่", "ชั้น", "เลขประจำตัว", "เลข ปชช.", "ชื่อ-สกุล", "หมู่เลือด", "วันเดือนปีเกิด", "อายุ", "ชื่อบิดา", "ชื่อมารดา", "ชื่อผู้ปกครอง", "ความสัมพันธ์", "อาชีพ", "ที่อยู่", "เบอร์โทรศัพท์", "นักเรียนที่ใกล้เคียง"]];
            students.forEach(s => {
                studentRows.push([
                    s.no, cls, s.code||'', s.nid||'', s.name, s.bloodType||'', s.dob||'', s.age||'', 
                    s.fatherName||'', s.motherName||'', s.guardianName||'', s.relation||'', s.occupation||'', s.address||'', s.phone||'', s.closeFriend||''
                ]);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(studentRows), "ข้อมูลนักเรียน");

            // แผ่นที่ 2: คะแนนและตัวชี้วัด (รวมน้ำหนักคะแนน)
            const indTotal = (c.indicators || []).length;
            const maxIndScore = indTotal * 3;
            const scoreHeaders = ["เลขที่", "ชื่อ-สกุล", "เก็บกลางภาค", "สอบกลางภาค", "เก็บปลายภาค", "สอบปลายภาค", "คะแนนรวม", "เกรด"];
            
            (c.indicators || []).forEach((ind, i) => scoreHeaders.push(ind));
            
            if(indTotal > 0) { scoreHeaders.push("น้ำหนักรวมคะแนน"); scoreHeaders.push("สรุปชี้วัด(ผ/มผ)"); }
            
            const scoreRows = [scoreHeaders];
            students.forEach(s => {
                const sc = (window.state.scores[c.id]||{})[s.id]||{};
                const stats = calcAtt(s.id);
                let total = (sc.mc||0) + (sc.me||0) + (sc.fc||0) + (stats.pct<80?0:(sc.fe||0));
                const grade = getGradeStr(total, stats.pct, s.statusR).g;
                
                // คำนวณน้ำหนักคะแนน
                let indSum = 0;
                for(let i=0; i<indTotal; i++) {
                    const val = Number(sc['ind_'+i]);
                    if(!isNaN(val)) indSum += val;
                }

                const row = [s.no, s.name, sc.mc||0, sc.me||0, sc.fc||0, sc.fe||0, Math.round(total), grade];
                (c.indicators || []).forEach((ind, i) => row.push(sc['ind_'+i] || '-'));
                if(indTotal > 0) { row.push(`${indSum}/${maxIndScore}`); row.push(sc.ind_summary || '-'); }
                scoreRows.push(row);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(scoreRows), "คะแนนวิชาและตัวชี้วัด");

            // แผ่นที่ 3: กิจกรรมพัฒนาผู้เรียน
            const acts = window.state.extraActivities || [];
            const actHeaders = ["เลขที่", "ชื่อ-สกุล", ...acts.map(a => a.name)];
            const actRows = [actHeaders];
            students.forEach(s => {
                const sc = window.state.extraScores[s.id] || {};
                actRows.push([s.no, s.name, ...acts.map(a => sc[a.id] || '-')]);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(actRows), "กิจกรรมพัฒนาผู้เรียน");

            // แผ่นที่ 4: เวลาเรียน (ใส่วันที่แบบละเอียด)
            const attHeaders = ["เลขที่", "ชื่อ-สกุล"];
            yearDates.forEach(d => { 
                // เพิ่ม วัน/เดือน แบบละเอียด เช่น วันจันทร์ 1 มกราคม
                attHeaders.push(`วัน${d.dayNameFull} ${d.date} ${thaiMonthsFull[d.monthIdx]}`); 
            });
            attHeaders.push("มา (วัน)", "เต็ม (วัน)", "ร้อยละ (%)");

            const attRows = [attHeaders];
            students.forEach(s => {
                const stats = calcAtt(s.id);
                const row = [s.no, s.name];
                
                yearDates.forEach(d => {
                    const def = (d.isWeekend || d.isHoliday) ? 'หยุด' : 'มา';
                    const val = ((window.state.attendance[window.state.selectedCourseId]||{})[s.id]||{})[d.id] || def;
                    row.push(val);
                });
                
                row.push(stats.p, stats.t, stats.pct + "%");
                attRows.push(row);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attRows), "เวลาเรียน");

            // แผ่นที่ 5: หน้า ปพ.5 (SAR)
            const cfg = (window.state.printConfigs && window.state.printConfigs[cls]) ? window.state.printConfigs[cls] : {};
            const courses = window.state.courses[cls] || [];
            
            let mCount = 0, fCount = 0;
            students.forEach(s => { if(s.name.includes('ด.ช.')) mCount++; else fCount++; });
            const totalStudents = mCount + fCount;
            
            const sarRows = [
                ["", "", "", "", "", "", "ปพ.๕"],
                ["สมุดบันทึกการพัฒนาคุณภาพผู้เรียน ชั้นประถมศึกษาปีที่ " + cls.replace('ป.','')],
                [],
                ["โรงเรียน", cfg.schoolName || window.state.schoolName || 'บ้านนาหว้าน้อย', "ตำบล/แขวง", cfg.subDistrict || 'กกสะทอน', "อำเภอ/เขต", cfg.district || 'ด่านซ้าย'],
                ["จังหวัด", cfg.province || 'เลย', "เขตพื้นที่การศึกษา", cfg.eduArea || 'เลย', "เขต", cfg.eduAreaZone || '3'],
                ["ปีการศึกษา", cfg.academicYear || window.state.academicYear || '2568', "ครูประจำชั้น", cfg.teacherName || '', "ผู้อำนวยการ", cfg.directorName || ''],
                [],
                ["ตารางสรุปผลสัมฤทธิ์ทางการเรียน"],
                ["รายวิชา", "หน่วยกิต", "4", "3.5", "3", "2.5", "2", "1.5", "1", "0", "ร", "มส"]
            ];
            
            courses.forEach(cObj => {
                let counts = {'4':0, '3.5':0, '3':0, '2.5':0, '2':0, '1.5':0, '1':0, '0':0, 'ร':0, 'มส':0};
                students.forEach(s => {
                    const sc = (window.state.scores[cObj.id]||{})[s.id]||{};
                    const att = calcAtt(s.id);
                    let tot = (sc.mc||0)+(sc.me||0)+(sc.fc||0); if(att.pct>=80) tot+=(sc.fe||0);
                    counts[getGradeStr(tot, att.pct, s.statusR).g]++;
                });
                sarRows.push([
                    cObj.name, cObj.credit, counts['4']||'-', counts['3.5']||'-', counts['3']||'-', counts['2.5']||'-', 
                    counts['2']||'-', counts['1.5']||'-', counts['1']||'-', counts['0']||'-', counts['ร']||'-', counts['มส']||'-'
                ]);
            });

            sarRows.push([]);
            sarRows.push(["ข้อมูลจำนวนนักเรียน", "ชาย", mCount, "หญิง", fCount, "รวม", totalStudents]);

            const wsSar = XLSX.utils.aoa_to_sheet(sarRows);
            
            wsSar['!merges'] = [
                { s: {r: 1, c: 0}, e: {r: 1, c: 6} },
                { s: {r: 7, c: 0}, e: {r: 7, c: 11} }
            ];
            XLSX.utils.book_append_sheet(wb, wsSar, "สรุปรายงาน ปพ.5");

            XLSX.writeFile(wb, `ระบบปพ5_ชั้น${cls.replace('.','')}.xlsx`);
        };

            if(!window.state.sysConfig) window.state.sysConfig = { editStudent: true, editMidterm: true, editFinal: true };

            renderApp();
